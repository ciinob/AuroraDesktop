name: Build & Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify Python sources
        run: |
          python -c "import pathlib, py_compile; [py_compile.compile(str(p), doraise=True) for p in pathlib.Path('src').glob('*.py')]"

      - name: Build native taskbar DLL
        shell: pwsh
        run: |
          cmake -S src/native -B build/native -A x64
          cmake --build build/native --config Release
          Copy-Item -Force build/native/out/Release/AuroraTaskbarTAP.dll assets/AuroraTaskbarTAP.dll

      - name: Build one-file exe
        run: |
          python -m PyInstaller --noconfirm --onefile --windowed --name AuroraDesktop `
            --distpath dist --workpath build/pyi --specpath build/pyi `
            --icon "$PWD/assets/aurora.ico" --add-data "$PWD/assets;assets" `
            --paths src `
            --hidden-import win32com.client --hidden-import pythoncom --hidden-import pywintypes `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module PySide6.QtPdf `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtNetwork `
            --exclude-module PIL --exclude-module fontTools --exclude-module brotli `
            --exclude-module tkinter --exclude-module unittest `
            src/main.py

      - name: Compute SHA256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/AuroraDesktop.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AuroraDesktop.exe" | Out-File -Encoding utf8NoBOM dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: AuroraDesktop-${{ github.sha }}
          path: |
            dist/AuroraDesktop.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AuroraDesktop.exe
            dist/SHA256SUMS.txt
